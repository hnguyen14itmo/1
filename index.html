const PAGE={home:['MỖI NGÀY MỘT CHÚT TIẾNG NGA','Chào mừng trở lại 👋'],study:['FLASHCARD VÀ ÔN TẬP NGẮT QUÃNG','Ôn tập từ vựng'],words:['TẤT CẢ TỪ VỰNG CỦA BẠN','Kho từ vựng'],quiz:['TỰ KIỂM TRA KIẾN THỨC','Luyện trắc nghiệm'],stats:['HÀNH TRÌNH HỌC CỦA BẠN','Thống kê học tập'],settings:['DỮ LIỆU VÀ TÙY CHỈNH','Cài đặt']};
const $=selector=>document.querySelector(selector);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key=s=>String(s||'').normalize('NFC').trim().toLocaleLowerCase('ru-RU').replace(/\s+/g,' ');
const shuffle=items=>{const arr=[...items];for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;};
const today=()=>dateStr(0);
function dateStr(offset){const d=new Date();d.setDate(d.getDate()+offset);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function normalizeWord(obj){if(typeof obj==='string')obj={ru:obj};if(!obj||typeof obj!=='object')return null;const ru=String(obj.ru??obj.russian??obj.word??'').trim();if(!ru)return null;return {id:'ru:'+key(ru),ru,vi:String(obj.vi??obj.vietnamese??obj.meaning??'').trim()||'Chưa có nghĩa',example:String(obj.definition??obj.explanation??obj.example??obj.sentence??'').trim(),topic:String(obj.topic??obj.category??'Từ của tôi').trim()||'Từ của tôi',source:'user',srs:{step:0,due:0,reviews:0,correct:0,last:0}};}
function initialState(){return {words:STARTER.map(x=>({...normalizeWord(x),source:'starter'})),log:{},dismissed:[],settings:{rate:.85},created:Date.now()};}
function loadState(){try{const raw=localStorage.getItem(STORE_KEY);if(!raw)return initialState();const obj=JSON.parse(raw);if(!Array.isArray(obj.words))return initialState();return {words:obj.words.map(w=>{const nw=normalizeWord(w);return nw?{...nw,source:w.source||'user',srs:{...nw.srs,...(w.srs||{})}}:null;}).filter(Boolean),log:obj.log||{},dismissed:Array.isArray(obj.dismissed)?obj.dismissed:[],settings:{rate:.85,...obj.settings},created:obj.created||Date.now()};}catch(e){console.warn('Không đọc được dữ liệu cũ',e);return initialState();}}
let state=loadState(),currentPage='home',studyMode='due',studySession=[],studyFlipped=false,wordSearch='',wordTopic='all',quiz=null;
const save=()=>{try{localStorage.setItem(STORE_KEY,JSON.stringify(state));return true;}catch(e){toast('Không lưu được tiến độ; hãy tải bản sao lưu.','bad');return false;}};
const due=w=>!w.srs?.due||w.srs.due<=Date.now();
const practiced=w=>(w.srs?.reviews||0)>0;
const learned=w=>(w.srs?.step||0)>=3;
function stats(){const ws=state.words,n=ws.length,p=ws.filter(practiced).length,l=ws.filter(learned).length,d=ws.filter(due).length,rounds=ws.reduce((n,w)=>n+(w.srs?.reviews||0),0),correct=ws.reduce((n,w)=>n+(w.srs?.correct||0),0);return {n,p,l,d,rounds,accuracy:rounds?Math.round(correct/rounds*100):0};}
const topicOptions=()=>[...new Set(state.words.map(w=>w.topic))].sort((a,b)=>a.localeCompare(b,'vi'));
function toast(message,bad=false){const holder=$('#toastbox'),node=document.createElement('div');node.className='toast '+(bad?'bad':'');node.textContent=message;holder.append(node);setTimeout(()=>node.remove(),3800);}
function renderNav(){const nodes=NAV.map(([id,icon,name])=>`<button type="button" class="nav-button" data-nav="${id}"><span class="nav-icon" aria-hidden="true">${icon}</span><span>${name}</span></button>`).join('');$('#desktop-nav').innerHTML=nodes;$('#mobile-nav').innerHTML=nodes;}
function updateChrome(){const s=stats(),percent=s.n?Math.round(s.p/s.n*100):0;$('#side-percent').textContent=percent+'%';$('#side-progress-bar').style.width=percent+'%';$('#side-progress-caption').textContent=`${s.p} / ${s.n} từ đã học`;$('#page-kicker').textContent=PAGE[currentPage][0];$('#page-title').textContent=PAGE[currentPage][1];document.querySelectorAll('[data-nav]').forEach(el=>{const active=el.dataset.nav===currentPage;el.classList.toggle('is-active',active);el.setAttribute('aria-current',active?'page':'false');});}
function render(){const root=$('#view-root');if(currentPage==='home')root.innerHTML=renderHome();else if(currentPage==='study')root.innerHTML=renderStudy();else if(currentPage==='words'){root.innerHTML=renderWords();renderWordList();}else if(currentPage==='quiz')root.innerHTML=renderQuiz();else if(currentPage==='stats')root.innerHTML=renderStats();else if(currentPage==='settings')root.innerHTML=renderSettings();updateChrome();}
function navigate(page){if(!PAGE[page])return;currentPage=page;if(page==='study')resetStudy();if(page==='quiz'&&!quiz)startQuiz();render();window.scrollTo({top:0,behavior:'smooth'});}
function statCards(){const s=stats();return `<section class="stat-grid" aria-label="Tổng quan tiến độ"><div class="stat-card"><span class="stat-icon">📚</span><div class="stat-name">Tổng số từ</div><div class="stat-number">${s.n}</div><div class="stat-hint">Trong kho từ của bạn</div></div><div class="stat-card"><span class="stat-icon">🎓</span><div class="stat-name">Đã luyện tập</div><div class="stat-number">${s.p}</div><div class="stat-hint">Đã ôn ít nhất 1 lần</div></div><div class="stat-card"><span class="stat-icon">🔁</span><div class="stat-name">Cần ôn hôm nay</div><div class="stat-number">${s.d}</div><div class="stat-hint">Theo lịch ghi nhớ</div></div><div class="stat-card"><span class="stat-icon">✨</span><div class="stat-name">Đã ghi nhớ tốt</div><div class="stat-number">${s.l}</div><div class="stat-hint">Đạt mốc ôn từ 7 ngày</div></div></section>`;}
function renderHome(){const s=stats(),next=state.words.find(due)||state.words[0];return `<section class="hero"><div class="hero-copy"><div class="eyebrow">✦ НЕМНОГО КАЖДЫЙ ДЕНЬ</div><h2>Hôm nay học thêm<br/>một chút tiếng Nga nhé!</h2><p>${s.d?`Bạn có <b style="color:white">${s.d} từ</b> đang chờ ôn tập. Hãy dành vài phút để nhớ lâu hơn.`:'Bạn đã ôn hết những từ đến hạn. Vẫn có thể học lại bất cứ lúc nào.'}</p><button class="hero-btn" data-nav="study">Bắt đầu ôn tập →</button></div></section>${statCards()}<div class="section-head"><div><h2>Tiếp tục học</h2><p>Thẻ từ và hoạt động dành cho hôm nay</p></div><button class="btn soft small" data-action="open-import">＋ Thêm từ mới</button></div><div class="split"><div class="panel pad"><div class="quick-head"><h3>🌱 Từ vựng hôm nay</h3><span class="tiny">${s.n?'Thử phát âm từ này':'Kho từ đang trống'}</span></div>${next?`<div class="quick-word" lang="ru">${esc(next.ru)}</div><div class="quick-meaning">${esc(next.vi)}</div><div class="quick-actions"><button class="btn line small" data-action="speak" data-id="${esc(next.id)}">🔊 Nghe phát âm</button><button class="btn primary small" data-nav="study">Ôn tập →</button></div>`:`<p class="muted" style="font-size:12px;margin-top:20px">Hãy thêm từ tiếng Nga đầu tiên vào kho từ nhé!</p><button class="btn primary small" data-action="open-import">Thêm từ</button>`}</div><div class="tip-card"><div class="tip-icon">💡</div><h3>Mẹo học hiệu quả</h3><p>Học mỗi ngày 5–10 phút, đọc to tiếng Nga, sau đó tự nhớ nghĩa trước khi lật thẻ.</p><div class="tip-note">Học ít nhưng đều đặn sẽ dễ nhớ hơn.</div></div></div>`;}
function resetStudy(){const pool=state.words.filter(w=>studyMode==='all'||(studyMode==='new'?!practiced(w):due(w)));studySession=shuffle(pool).map(w=>w.id);studyFlipped=false;}
function studyCard(){const w=state.words.find(x=>x.id===studySession[0]);if(!w)return `<div class="panel study-empty"><div class="empty-icon">🎉</div><h3>Không còn thẻ nào trong lượt này!</h3><p>${studyMode==='due'?'Bạn đã xử lý hết các từ đến hạn. Hãy quay lại vào lần ôn tiếp theo.':'Bạn đã xem hết thẻ trong chế độ này.'}</p><div class="filter-row" style="justify-content:center"><button class="btn primary" data-action="restart-study">Học lại</button><button class="btn line" data-action="study-all">Xem mọi từ</button></div></div>`;return `<div class="panel flash-frame"><div class="flash-meta"><span>${esc(w.topic)}</span><span>Còn ${studySession.length} thẻ · <button class="btn-icon" data-action="speak" data-id="${esc(w.id)}" title="Nghe tiếng Nga" style="width:30px;height:30px">🔊</button></span></div><button type="button" class="flashcard" data-action="flip" aria-label="Lật thẻ từ"><div class="face-label">${studyFlipped?'NGHĨA TIẾNG VIỆT':'TỪ TIẾNG NGA'}</div>${studyFlipped?`<div class="translation">${esc(w.vi)}</div><div class="explain-heading">Giải thích bằng tiếng Nga</div><div class="sentence" lang="ru">${esc(w.example||'Chưa có giải thích tiếng Nga')}</div>`:`<h3 lang="ru">${esc(w.ru)}</h3>`}<div class="tap">↻ Chạm để lật thẻ</div></button><div class="flash-actions"><button class="btn line" data-action="review-hard">↻ Chưa nhớ</button><button class="btn primary" data-action="review-good">✓ Đã nhớ</button></div><div class="tiny" style="margin-top:13px">Phím tắt: Space lật thẻ · 1 chưa nhớ · 2 đã nhớ</div></div>`;}
function renderStudy(){return `<div class="section-head" style="margin-top:0"><div><h2>Học bằng thẻ</h2><p>Hệ thống sẽ lên lịch ôn theo mức độ bạn nhớ</p></div></div><div class="filter-row">${[['due','Đến hạn'],['new','Chưa học'],['all','Tất cả']].map(([id,name])=>`<button class="chip ${id===studyMode?'selected':''}" data-study-mode="${id}">${name}</button>`).join('')}</div><div class="study-layout"><div>${studyCard()}</div><aside class="panel side-study"><h3>🌿 Nhớ lâu hơn</h3><p>Nhìn từ tiếng Nga, thử nhớ nghĩa rồi lật thẻ để xem giải thích bằng tiếng Nga.</p><div class="learn-note">✓ <b>Đã nhớ</b>: tăng khoảng cách đến lần ôn sau.<br/><br/>↻ <b>Chưa nhớ</b>: từ sẽ xuất hiện lại sớm hơn.<br/><br/>🔊 Bấm loa để nghe cách đọc tiếng Nga.</div><div style="margin-top:21px"><button class="btn soft small" data-action="open-import">＋ Thêm bộ từ</button></div></aside></div>`;}
function renderWords(){if(wordTopic!=='all'&&!topicOptions().includes(wordTopic))wordTopic='all';return `<div class="section-head" style="margin-top:0"><div><h2>Từ vựng của tôi <span style="color:#92a7a0">(${state.words.length})</span></h2><p>Tìm, nghe, chỉnh sửa và quản lý các từ đã lưu</p></div><div class="filter-row"><button class="btn line small" data-action="open-import">⇧ Nhập danh sách</button><button class="btn primary small" data-action="open-add">＋ Thêm từ</button></div></div><div class="toolbar"><label class="searchbox"><span aria-hidden="true">⌕</span><input id="word-search" type="search" placeholder="Tìm từ, nghĩa hoặc giải thích tiếng Nga..." value="${esc(wordSearch)}" autocomplete="off" aria-label="Tìm từ vựng"/></label><select class="select" id="topic-filter" aria-label="Lọc theo chủ đề"><option value="all">Tất cả chủ đề</option>${topicOptions().map(topic=>`<option value="${esc(topic)}" ${wordTopic===topic?'selected':''}>${esc(topic)}</option>`).join('')}</select></div><div id="words-content"></div>`;}
function filteredWords(){return state.words.filter(w=>(wordTopic==='all'||w.topic===wordTopic)&&(!wordSearch||[w.ru,w.vi,w.example,w.topic].join(' ').toLocaleLowerCase().includes(wordSearch.toLocaleLowerCase()))).sort((a,b)=>a.ru.localeCompare(b.ru,'ru'));}
function renderWordList(){const target=$('#words-content');if(!target)return;const items=filteredWords();target.innerHTML=items.length?`<div class="word-list">${items.map((w,i)=>`<article class="panel word-row"><div class="word-number">${String(i+1).padStart(2,'0')}</div><div class="word-body"><div class="word-ru" lang="ru">${esc(w.ru)} <span class="state-dot ${practiced(w)?'learned':''}" title="${practiced(w)?'Đã học':'Chưa học'}"></span></div><div class="word-vi">${esc(w.vi)}</div>${w.example?`<div class="word-ex" lang="ru"><span class="explain-inline">RU ·</span> ${esc(w.example)}</div>`:''}</div><span class="topic-badge">${esc(w.topic)}</span><div class="word-tools"><button class="btn-icon" style="min-width:32px;height:32px" data-action="speak" data-id="${esc(w.id)}" title="Phát âm">♫</button><button class="btn-icon" style="min-width:32px;height:32px" data-action="edit" data-id="${esc(w.id)}" title="Sửa từ">✎</button><button class="btn-icon" style="min-width:32px;height:32px" data-action="delete" data-id="${esc(w.id)}" title="Xóa từ">×</button></div></article>`).join('')}</div><div class="tiny" style="padding:13px 3px">Đang hiển thị ${items.length} / ${state.words.length} từ.</div>`:`<div class="panel empty-box">Không tìm thấy từ phù hợp. <button class="btn soft small" data-action="open-add" style="margin-left:8px">Thêm từ</button></div>`;}
function startQuiz(){quiz={ids:shuffle(state.words).slice(0,Math.min(10,state.words.length)).map(w=>w.id),index:0,score:0,answered:false,selected:null,optionsId:null};}
function getQuizQuestion(){if(!quiz||quiz.index>=quiz.ids.length)return null;return state.words.find(w=>w.id===quiz.ids[quiz.index]);}
function quizOptions(w){if(!quiz.optionsId){const seen=new Set([key(w.vi)]),others=shuffle(state.words.filter(x=>x.id!==w.id)).filter(x=>{const k=key(x.vi);if(seen.has(k))return false;seen.add(k);return true;}).slice(0,3);quiz.optionsId=shuffle([w,...others]).map(x=>x.id);}return quiz.optionsId.map(id=>state.words.find(x=>x.id===id)).filter(Boolean);}
function renderQuiz(){if(state.words.length<2)return `<div class="panel study-empty"><div class="empty-icon">✍️</div><h3>Hãy thêm ít nhất 2 từ</h3><p>Bạn cần tối thiểu 2 từ vựng để tạo bài trắc nghiệm.</p><button class="btn primary" data-action="open-import">Thêm từ mới</button></div>`;if(!quiz)startQuiz();const w=getQuizQuestion();if(!w)return `<div class="panel quiz-finish"><div class="trophy">🏆</div><div class="eyebrow muted">BÀI KIỂM TRA HOÀN THÀNH</div><h2>${quiz.score} / ${quiz.ids.length} câu đúng</h2><p>${quiz.score===quiz.ids.length?'Xuất sắc! Bạn đã làm đúng toàn bộ câu hỏi.':'Hãy ôn lại các từ chưa nhớ, sau đó thử làm lại nhé.'}</p><div class="filter-row" style="justify-content:center;margin-top:18px"><button class="btn primary" data-action="restart-quiz">Làm bài mới ↻</button><button class="btn line" data-nav="study">Ôn flashcard</button></div></div>`;const choices=quizOptions(w);return `<div class="panel quiz-card"><div class="quiz-footer" style="margin-top:0"><span class="quiz-label">Câu ${quiz.index+1} / ${quiz.ids.length}</span><span class="quiz-label">✓ ${quiz.score} đúng</span></div><div class="quiz-progress"><div style="width:${Math.round(quiz.index/quiz.ids.length*100)}%"></div></div><div class="quiz-label">Từ này có nghĩa là gì?</div><h2 class="quiz-q" lang="ru">${esc(w.ru)} <button class="btn-icon" data-action="speak" data-id="${esc(w.id)}" aria-label="Nghe tiếng Nga" style="vertical-align:middle">♫</button></h2><div class="choices">${choices.map((opt,i)=>`<button class="choice ${quiz.answered?(opt.id===w.id?'right':quiz.selected===opt.id?'wrong':''):''}" data-answer="${esc(opt.id)}" ${quiz.answered?'disabled':''}><span style="color:#8ba49b;margin-right:9px">${String.fromCharCode(65+i)}.</span> ${esc(opt.vi)}</button>`).join('')}</div>${quiz.answered?`<div class="quiz-result ${quiz.selected===w.id?'':'bad'}">${quiz.selected===w.id?'✓ Chính xác!':'✗ Chưa đúng.'} <strong>${esc(w.ru)}</strong> — ${esc(w.vi)}${w.example?`<br/><span lang="ru"><strong>Giải thích (RU):</strong> ${esc(w.example)}</span>`:''}</div>`:''}<div class="quiz-footer"><span class="tiny">Trả lời để ghi nhớ từ tốt hơn.</span>${quiz.answered?`<button class="btn primary" data-action="quiz-next">${quiz.index===quiz.ids.length-1?'Xem kết quả':'Câu tiếp theo →'}</button>`:`<button class="btn line small" data-action="restart-quiz">Tạo bộ câu hỏi khác</button>`}</div></div>`;}
function renderStats(){const s=stats(),last7=Array.from({length:7},(_,i)=>{const offset=i-6,k=dateStr(offset);return {date:k,count:state.log[k]?.reviewed||0,day:['CN','T2','T3','T4','T5','T6','T7'][new Date(k+'T12:00:00').getDay()],isToday:offset===0};}),max=Math.max(1,...last7.map(x=>x.count)),count7=last7.reduce((sum,x)=>sum+x.count,0);return `${statCards()}<div class="stats-grid"><div class="panel pad"><div class="quick-head"><h3>Hoạt động 7 ngày gần đây</h3><span class="tiny">${count7} lượt ôn</span></div><div class="chart" role="img" aria-label="Lượt ôn 7 ngày: ${last7.map(x=>x.day+' '+x.count).join(', ')}">${last7.map(x=>`<div class="chart-bar-group"><div class="chart-num">${x.count||''}</div><div class="chart-bar ${x.isToday?'today':''}" style="height:${Math.max(4,Math.round(x.count/max*105))}px"></div><div class="chart-name">${x.day}</div></div>`).join('')}</div><div class="legend"><span><i></i> Ngày trước</span><span class="today"><i></i> Hôm nay</span></div></div><div class="panel pad"><div class="quick-head"><h3>Tiến bộ của bạn</h3><span>📈</span></div><div class="metric-list"><div class="metric-row"><span>Đã luyện ít nhất 1 lần</span><strong>${s.n?Math.round(s.p/s.n*100):0}%</strong></div><div class="progress-track" style="background:#edf3ee;margin:0"><div style="width:${s.n?Math.round(s.p/s.n*100):0}%;background:#238e7d"></div></div><div class="metric-row"><span>Tỷ lệ trả lời đã nhớ / đúng</span><strong>${s.accuracy}%</strong></div><div class="metric-row"><span>Tổng số lượt luyện</span><strong>${s.rounds}</strong></div><div class="metric-row"><span>Từ đã ôn lên lịch dài hơn</span><strong>${s.l}</strong></div><div class="metric-row"><span>Cần ôn ngay</span><strong>${s.d}</strong></div></div></div></div><div class="section-head"><div><h2>Bắt đầu ôn lại</h2><p>Học một chút mỗi ngày để ghi nhớ lâu hơn.</p></div><button class="btn primary small" data-nav="study">Mở Flashcard →</button></div>`;}
function renderSettings(){return `<div class="settings-grid"><section class="panel setting-panel"><h3>📥 Dữ liệu từ vựng</h3><p>Nhập thêm từ vựng hoặc xuất một bản sao lưu gồm cả tiến độ học.</p><div class="stack"><button class="btn primary" data-action="open-import">＋ Nhập từ hàng loạt</button><button class="btn line" data-action="export-backup">↓ Tải bản sao lưu JSON</button><button class="btn line" data-action="export-tsv">↓ Xuất từ vựng TSV</button></div></section><section class="panel setting-panel"><h3>🔊 Phát âm tiếng Nga</h3><p>Máy phát tiếng Nga bằng giọng có sẵn trên thiết bị khi trình duyệt hỗ trợ.</p><label for="rate-select" class="tiny">Tốc độ đọc</label><div style="margin-top:8px"><select class="select" id="rate-select"><option value=".7" ${state.settings.rate===.7?'selected':''}>Chậm (0,7x)</option><option value=".85" ${state.settings.rate===.85?'selected':''}>Vừa (0,85x)</option><option value="1" ${state.settings.rate===1?'selected':''}>Bình thường (1x)</option></select></div><button class="btn soft small" data-action="test-speech" style="margin-top:12px">♫ Nghe thử</button></section><section class="panel setting-panel"><h3>☁️ Cập nhật bộ từ</h3><p>Khi website được đăng lên GitHub Pages cùng tệp <b>vocabulary.json</b>, ứng dụng sẽ kiểm tra từ mới mỗi khi mở. Tiến độ học trên máy vẫn được giữ lại.</p><button class="btn line" data-action="sync">↻ Kiểm tra từ mới</button><p class="tiny" style="margin-top:14px">Trạng thái: <span id="sync-status">${location.protocol==='file:'?'Chế độ tệp cục bộ':'Sẵn sàng đồng bộ'}</span></p></section><section class="panel setting-panel"><h3>🧹 Dọn kho từ</h3><p>Ứng dụng có một bộ mẫu nhỏ. Bạn có thể xóa bộ mẫu trước khi nhập danh sách của mình.</p><div class="stack"><button class="btn line" data-action="remove-starter">Xóa các từ mẫu</button><button class="btn danger" data-action="clear-all">Xóa toàn bộ từ và tiến độ</button></div></section></div><div class="help-note" style="margin-top:17px">🔒 <b>Quyền riêng tư:</b> Từ bạn tự thêm và tiến độ học được lưu trong trình duyệt hiện tại. Dữ liệu <b>không tự đồng bộ giữa điện thoại và máy tính</b>. Hãy xuất bản sao lưu JSON trước khi xóa dữ liệu trình duyệt hoặc chuyển máy.</div>`;}
function reviewWord(w,correct){if(!w)return;const s=w.srs;s.reviews=(s.reviews||0)+1;if(correct){s.correct=(s.correct||0)+1;s.step=Math.min((s.step||0)+1,8);s.due=Date.now()+DAY*[0,1,3,7,14,30,60,120,180][s.step];}else{s.step=0;s.due=Date.now()+10*60000;}s.last=Date.now();const day=today();state.log[day]??={reviewed:0,correct:0};state.log[day].reviewed++;if(correct)state.log[day].correct++;save();}
function studyMark(correct){const w=state.words.find(x=>x.id===studySession[0]);if(!w)return;reviewWord(w,correct);studySession.shift();studyFlipped=false;render();if(!studySession.length)toast('Đã hoàn thành lượt ôn! 🎉');}
function answerQuiz(id){if(!quiz||quiz.answered)return;const w=getQuizQuestion();if(!w)return;quiz.answered=true;quiz.selected=id;const correct=id===w.id;if(correct)quiz.score++;reviewWord(w,correct);render();}
function mergeWords(incoming,{remote=false}={}){let added=0,updated=0,skipped=0;const existing=new Map(state.words.map(w=>[key(w.ru),w]));for(const raw of incoming){const item=normalizeWord(raw);if(!item){skipped++;continue;}const k=key(item.ru);if(remote&&state.dismissed.includes(k)){skipped++;continue;}if(!remote)state.dismissed=state.dismissed.filter(x=>x!==k);const prev=existing.get(k);if(prev){if(item.vi!=='Chưa có nghĩa')prev.vi=item.vi;if(item.example)prev.example=item.example;if(item.topic!=='Từ của tôi')prev.topic=item.topic;if(remote)prev.source='remote';updated++;}else{item.source=remote?'remote':'user';state.words.push(item);existing.set(k,item);added++;}}if(added||updated){save();quiz=null;resetStudy();render();}return {added,updated,skipped};}
function parseText(input){const raw=input.trim();if(!raw)return[];if(raw.startsWith('[')||raw.startsWith('{')){let data;try{data=JSON.parse(raw);}catch(e){throw Error('JSON không hợp lệ. Hãy kiểm tra dấu ngoặc và dấu phẩy.');}const arr=Array.isArray(data)?data:data.words||data.vocabulary;if(!Array.isArray(arr))throw Error('JSON phải chứa một mảng từ vựng.');return arr;}
return raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(line=>{let vals;if(line.includes('\t'))vals=line.split('\t');else if(line.includes('|'))vals=line.split('|');else if(line.includes(' — '))vals=line.split(' — ');else if(line.includes(' - '))vals=line.split(' - ');else if(line.includes(';'))vals=line.split(';');else vals=[line];vals=vals.map(x=>x.trim());if(/^(tiếng nga|russian|ru|слово)$/i.test(vals[0]))return null;return {ru:vals[0],vi:vals[1]||'',example:vals[2]||'',topic:vals[3]||'Từ của tôi'};}).filter(Boolean);}
async function syncRemote(manual=false){if(location.protocol==='file:'){if(manual)toast('Bạn đang mở HTML cục bộ. Hãy nhập từ hoặc đăng website để đồng bộ.');return;}const status=$('#sync-status');if(status)status.textContent='Đang kiểm tra...';try{const response=await fetch('./vocabulary.json?fresh='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json(),words=Array.isArray(data)?data:data.words;if(!Array.isArray(words))throw Error('Không có danh sách từ');if(data.replaceStarter===true){const keep=new Set(words.map(w=>key(w.ru||w.russian||w.word)));const original=state.words.length;state.words=state.words.filter(w=>!(w.source==='starter'||w.topic==='Mẫu · Bảo mật')||keep.has(key(w.ru)));if(state.words.length!==original){save();resetStudy();render();}}const result=mergeWords(words,{remote:true});const message=`Đã đồng bộ: ${result.added} từ mới, cập nhật ${result.updated} từ`;if(manual)toast(message);const el=$('#sync-status');if(el)el.textContent=message;}catch(e){if(manual)toast('Chưa tìm được vocabulary.json trên máy chủ. Bạn vẫn có thể nhập thủ công.','bad');const el=$('#sync-status');if(el)el.textContent='Chưa có tệp từ trên máy chủ';}}
function speak(ru){if(!('speechSynthesis'in window)){toast('Trình duyệt này chưa hỗ trợ phát âm.','bad');return;}speechSynthesis.cancel();const utter=new SpeechSynthesisUtterance(ru);utter.lang='ru-RU';utter.rate=Number(state.settings.rate||.85);const voices=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('ru'));if(voices.length)utter.voice=voices[0];speechSynthesis.speak(utter);}
function openModal(html){$('#modal-container').innerHTML=html;$('#modal-screen').classList.remove('hidden');document.body.style.overflow='hidden';setTimeout(()=>$('#modal-container input,#modal-container textarea')?.focus(),30);}
function closeModal(){$('#modal-screen').classList.add('hidden');$('#modal-container').innerHTML='';document.body.style.overflow='';}
function modalBase(title,desc,fields,buttons){return `<div class="modal-head"><div><h2>${title}</h2><p>${desc}</p></div><button class="btn-icon" data-action="close-modal" aria-label="Đóng">×</button></div>${fields}<div class="modal-actions">${buttons}</div>`;}
function openAdd(w){const edit=!!w;openModal(modalBase(edit?'Sửa từ vựng':'Thêm từ mới',edit?'Chỉnh sửa thông tin thẻ từ của bạn.':'Điền tiếng Nga và tiếng Việt để bắt đầu học.',`<form id="word-form" data-old-id="${edit?esc(w.id):''}"><div class="input-field"><label for="add-ru">Từ tiếng Nga *</label><input id="add-ru" required maxlength="200" value="${esc(w?.ru||'')}" placeholder="Ví dụ: безопасный"/></div><div class="input-field"><label for="add-vi">Nghĩa tiếng Việt</label><input id="add-vi" maxlength="500" value="${esc(w?.vi==='Chưa có nghĩa'?'':w?.vi||'')}" placeholder="Ví dụ: an toàn"/></div><div class="input-field"><label for="add-ex">Giải thích bằng tiếng Nga (B1)</label><textarea id="add-ex" rows="2" maxlength="800" placeholder="Такой, который защищён от опасности.">${esc(w?.example||'')}</textarea></div><div class="input-field"><label for="add-topic">Chủ đề</label><input id="add-topic" maxlength="100" value="${esc(w?.topic||'Từ của tôi')}" placeholder="Ví dụ: B1 / Bảo mật"/></div></form>`,`<button class="btn line" data-action="close-modal">Hủy</button><button class="btn primary" data-action="save-word">${edit?'Lưu thay đổi':'Thêm từ'}</button>`));}
function openImport(){openModal(modalBase('Nhập bộ từ vựng','Dán nhiều từ cùng lúc. Bạn có thể gửi từ cho ChatGPT để nhận danh sách đúng định dạng.',`<div class="input-field"><label for="bulk-words">Danh sách tiếng Nga — tiếng Việt</label><textarea id="bulk-words" rows="7" spellcheck="false" placeholder="безопасность | bảo mật | Состояние, когда информация защищена. | Chủ đề bảo mật\nугроза | mối đe dọa | То, что может причинить вред. | Chủ đề bảo mật"></textarea><small>Mỗi dòng một từ. Ngăn cột bằng dấu | hoặc phím Tab. Cũng hỗ trợ JSON, TSV.</small></div><div class="input-field"><label for="import-file">Hoặc chọn tệp .json / .txt / .tsv / .csv</label><input class="file-input" type="file" id="import-file" accept=".json,.txt,.tsv,.csv,application/json,text/plain,text/tab-separated-values,text/csv"/></div><div class="format-code">TỪ NGA | NGHĨA VIỆT | GIẢI THÍCH (RU) | CHỦ ĐỀ\nпароль | mật khẩu | Секретные символы для входа в систему. | B1</div><p class="tiny">Khi trùng từ tiếng Nga, hệ thống sẽ cập nhật nội dung và <b>giữ nguyên tiến độ học</b>.</p>`,`<button class="btn line" data-action="close-modal">Hủy</button><button class="btn primary" data-action="do-import">Nhập từ vựng →</button>`));}
function download(name,content,type){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);}
function exportBackup(){download('slovo-backup-'+today()+'.json',JSON.stringify({format:'slovo-backup',version:1,exportedAt:new Date().toISOString(),...state},null,2),'application/json;charset=utf-8');toast('Đã tải bản sao lưu!');}
function exportTSV(){const header=['ru','vi','definition','topic'],lines=[header.join('\t'),...state.words.map(w=>header.map(k=>String((k==='definition'?w.example:w[k])||'').replace(/[\r\n\t]+/g,' ')).join('\t'))];download('slovo-vocabulary-'+today()+'.tsv','\ufeff'+lines.join('\n'),'text/tab-separated-values;charset=utf-8');toast('Đã tải danh sách TSV!');}
function restoreBackup(raw){const obj=JSON.parse(raw);if(obj?.format!=='slovo-backup'||!Array.isArray(obj.words))throw Error('Đây không phải tệp sao lưu của Slovo Lab');if(!confirm('Khôi phục sao lưu sẽ thay toàn bộ dữ liệu đang có trên trình duyệt này. Tiếp tục?'))return false;const words=obj.words.map(w=>{const nw=normalizeWord(w);return nw?{...nw,srs:{...nw.srs,...(w.srs||{})},source:w.source||'user'}:null;}).filter(Boolean);state={words,log:obj.log||{},dismissed:obj.dismissed||[],settings:{rate:.85,...(obj.settings||{})},created:obj.created||Date.now()};save();quiz=null;resetStudy();render();return true;}
function deleteWord(id){const idx=state.words.findIndex(w=>w.id===id);if(idx<0)return;const w=state.words[idx];if(!confirm(`Xóa từ “${w.ru}” khỏi kho từ?`))return;state.words.splice(idx,1);if(!state.dismissed.includes(key(w.ru)))state.dismissed.push(key(w.ru));save();resetStudy();quiz=null;render();toast('Đã xóa từ.');}
function removeStarter(){const items=state.words.filter(w=>w.source==='starter'||w.topic==='Mẫu · Bảo mật');if(!items.length){toast('Không còn từ mẫu.');return;}if(!confirm(`Xóa ${items.length} từ mẫu? Các từ riêng của bạn không bị ảnh hưởng.`))return;for(const w of items)if(!state.dismissed.includes(key(w.ru)))state.dismissed.push(key(w.ru));state.words=state.words.filter(w=>!items.includes(w));save();quiz=null;resetStudy();render();toast(`Đã xóa ${items.length} từ mẫu.`);}
function clearAll(){if(!confirm('Xóa TẤT CẢ từ vựng và tiến độ học trên trình duyệt này? Không thể hoàn tác nếu chưa sao lưu.'))return;const ignored=[...new Set([...state.dismissed,...state.words.map(w=>key(w.ru))])];state={words:[],log:{},dismissed:ignored,settings:{rate:.85},created:Date.now()};save();quiz=null;resetStudy();render();toast('Đã xóa tất cả dữ liệu.');}
function saveWord(){const form=$('#word-form');if(!form)return;const ru=$('#add-ru').value.trim();if(!ru){toast('Hãy nhập từ tiếng Nga.','bad');$('#add-ru').focus();return;}const oldId=form.dataset.oldId,old=state.words.find(w=>w.id===oldId),item=normalizeWord({ru,vi:$('#add-vi').value,example:$('#add-ex').value,topic:$('#add-topic').value}),dup=state.words.find(w=>key(w.ru)===key(ru)&&w.id!==oldId);if(dup){toast('Từ này đã tồn tại. Hãy sửa từ trong kho từ.','bad');return;}if(old){if(old.id!==item.id&&!state.dismissed.includes(key(old.ru)))state.dismissed.push(key(old.ru));Object.assign(old,{...item,srs:old.srs,source:'user'});}else state.words.push(item);state.dismissed=state.dismissed.filter(k=>k!==key(ru));save();quiz=null;resetStudy();closeModal();render();toast(old?'Đã lưu thay đổi.':'Đã thêm từ mới.');}
async function doImport(){let raw=$('#bulk-words')?.value.trim()||'';const file=$('#import-file')?.files?.[0];if(file){try{raw=await file.text();}catch(e){toast('Không đọc được tệp này.','bad');return;}}if(!raw){toast('Bạn chưa nhập danh sách từ.','bad');return;}let maybeBackup;try{maybeBackup=JSON.parse(raw);}catch(e){}if(maybeBackup?.format==='slovo-backup'){try{if(restoreBackup(raw)){closeModal();toast('Đã khôi phục bản sao lưu.');}}catch(e){toast(e.message,'bad');}return;}try{const words=parseText(raw),result=mergeWords(words);closeModal();toast(`Đã nhập ${result.added} từ mới, cập nhật ${result.updated} từ.`);}catch(e){toast(e.message||'Không thể nhập dữ liệu','bad');}}
function bindEvents(){document.addEventListener('click',async e=>{const button=e.target.closest('[data-action],[data-nav],[data-study-mode],[data-answer]');if(!button){if(e.target===$('#modal-screen'))closeModal();return;}if(button.dataset.nav){navigate(button.dataset.nav);return;}if(button.dataset.studyMode){studyMode=button.dataset.studyMode;resetStudy();render();return;}if(button.dataset.answer){answerQuiz(button.dataset.answer);return;}
const act=button.dataset.action,id=button.dataset.id;switch(act){
 case 'sync':await syncRemote(true);break;
 case 'open-add':openAdd();break;
 case 'open-import':openImport();break;
 case 'close-modal':closeModal();break;
 case 'save-word':saveWord();break;
 case 'do-import':await doImport();break;
 case 'edit':openAdd(state.words.find(w=>w.id===id));break;
 case 'delete':deleteWord(id);break;
 case 'speak':speak(state.words.find(w=>w.id===id)?.ru||'');break;
 case 'test-speech':speak('Здравствуйте! Я изучаю русский язык.');break;
 case 'flip':studyFlipped=!studyFlipped;render();break;
 case 'review-good':studyMark(true);break;
 case 'review-hard':studyMark(false);break;
 case 'restart-study':resetStudy();render();break;
 case 'study-all':studyMode='all';resetStudy();render();break;
 case 'restart-quiz':startQuiz();render();break;
 case 'quiz-next':quiz.index++;quiz.answered=false;quiz.selected=null;quiz.optionsId=null;render();break;
 case 'export-backup':exportBackup();break;
 case 'export-tsv':exportTSV();break;
 case 'remove-starter':removeStarter();break;
 case 'clear-all':clearAll();break;
 }});
document.addEventListener('input',e=>{if(e.target.id==='word-search'){wordSearch=e.target.value;renderWordList();}});
document.addEventListener('change',e=>{if(e.target.id==='topic-filter'){wordTopic=e.target.value;renderWordList();}if(e.target.id==='rate-select'){state.settings.rate=Number(e.target.value);save();}});
document.addEventListener('submit',e=>{if(e.target.id==='word-form'){e.preventDefault();saveWord();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal-screen').classList.contains('hidden')){closeModal();return;}if(currentPage!=='study'||!$('#modal-screen').classList.contains('hidden'))return;if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;if(e.code==='Space'){e.preventDefault();if(studySession.length){studyFlipped=!studyFlipped;render();}}else if(e.key==='1')studyMark(false);else if(e.key==='2')studyMark(true);});}
renderNav();resetStudy();render();bindEvents();syncRemote(false);
window.slovoLab={version:'1.0',exportData:()=>JSON.parse(JSON.stringify(state)),addWords:incoming=>mergeWords(incoming)};

</script>
